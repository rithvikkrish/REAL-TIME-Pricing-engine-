services:
  redis:
    image: redis:7-alpine
    container_name: pricing-engine-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pricing-network

  pricing-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: real-time-pricing-engine
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - REDIS_ENABLED=true
      - UPSTREAM_WS_URL=${UPSTREAM_WS_URL:-wss://v3-prod.livefxhub.com/ws/algo}
      - UPSTREAM_API_KEY=${UPSTREAM_API_KEY}
      - UPSTREAM_SECRET_KEY=${UPSTREAM_SECRET_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - pricing-network

volumes:
  redis-data:

networks:
  pricing-network:
    driver: bridge
